  - {from: 0, to: 34.7, pids: {max: 16}}
  - {from: 41.8, to: 66.1, mem: {max: 512Mi}}
  - {from: 75, to: 100.5, pids: {max: 16}}
  - {from: 90.9, to: 95.9, mem: {max: 512Mi}}
  - {from: 151.8, to: 156.8, pids: {max: 16}}
  - {from: 177.4, to: 212.9, pids: {max: 64}}
  - {from: 212.9, to: 226.4, pids: {max: 16}}
  - {from: 214.4, to: 300, mem: {max: 512Mi}}
  - {from: 273.8, to: 300, pids: {max: 16}}
