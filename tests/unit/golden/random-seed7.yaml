  seed: 7
  knobs: [mem.max, pids.max]
  levels:
    mem.max: [512Mi, 1Gi, max]
    pids.max: ['16', '64', max]
  mean: 30.0
  min: 5.0
  max: 120.0
  duration: 300.0
  rprof_version: 0.1.0
defaults:
  mem: {max: max}
  pids: {max: max}
segments:
