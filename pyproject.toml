[project]
name = "rprof"
version = "0.1.0"
description = "OS resource profiles for sandboxed agents: apply time-varying cgroup/network/disk limits to a container and record what it used."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
net = ["pyroute2>=0.7"]

[project.scripts]
rprof = "rprof.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-rerunfailures>=14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rprof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timing: timing-sensitive test (one retry allowed, bands in tests/tolerances.yaml)",
    "integration: needs root, Docker and cgroup v2",
    "e2e: end-to-end scripted agent",
    "slow: takes more than a minute",
]
addopts = "-ra"
